name: Build and Deploy IES-Frontend QAS (Blue-Green with IIS Auto Replace)

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./
    env:
      BLUE_DIR: C:\deployment\sfa-web-backend\blue
      GREEN_DIR: C:\deployment\sfa-web-backend\green
      ACTIVE_ENV_FILE: C:\deployment\sfa-web-backend\active_env.txt
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4
